name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias
        run: uv sync --all-extras --dev

      - name: Formatacao e lint
        run: |
          uv run ruff format --check src tests app
          uv run ruff check src tests app

      - name: Tipos
        run: uv run mypy

      - name: Testes
        # Nenhum teste chama a API do provedor: os dubles cobrem o LLM e o
        # indice roda em memoria, entao o job nao precisa de segredo.
        run: uv run pytest --cov-fail-under=85

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: .coverage
          if-no-files-found: ignore

  build:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: finance-rag-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir o container e checar o health
        run: |
          docker run -d --name finrag -p 8000:8000 \
            -e FINRAG_LLM__API_KEY=chave-de-fumaca \
            finance-rag-copilot:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              curl -s http://localhost:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "A API nao respondeu no /health"
          docker logs finrag
          exit 1

  evaluation:
    name: Avaliacao no golden dataset
    # Este job chama o provedor de verdade, entao roda apenas quando a chave
    # existe: em fork, sem segredo, ele e ignorado em vez de falhar.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINRAG_LLM__API_KEY: ${{ secrets.FINRAG_LLM__API_KEY }}
      # Indice persistido em disco: o passo de indexacao e o de avaliacao rodam
      # em processos diferentes, e o modo em memoria perderia o indice entre eles.
      FINRAG_VECTORSTORE__URL: .qdrant
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias
        run: uv sync --dev

      - name: Verificar se o segredo existe
        id: guard
        run: echo "has_key=${{ secrets.FINRAG_LLM__API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Indexar o corpus
        if: steps.guard.outputs.has_key == 'true'
        run: uv run finrag ingest

      - name: Rodar a avaliacao com porta de qualidade
        if: steps.guard.outputs.has_key == 'true'
        run: uv run finrag eval --min-pass-rate 0.80

      - name: Publicar relatorio
        if: always() && steps.guard.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-avaliacao
          path: reports/
          if-no-files-found: ignore
